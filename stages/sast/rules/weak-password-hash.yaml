rules:
  - id: devsecops-python-weak-hash-for-password
    languages: [python]
    severity: ERROR
    message: >-
      MD5 or SHA-1 is used to hash a password. These are fast, broken general-purpose
      digests: stolen hashes can be reversed with rainbow tables or brute force in
      seconds. Use a slow, salted password hash instead.
    metadata:
      category: security
      cwe: "CWE-327: Use of a Broken or Risky Cryptographic Algorithm"
      owasp: "A02:2021 - Cryptographic Failures"
      confidence: HIGH
      likelihood: HIGH
      impact: MEDIUM
      technology: [python, hashlib]
      remediation: "Use a password hashing function such as hashlib.scrypt, bcrypt or argon2 with a per-user random salt."
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html
    patterns:
      - pattern-either:
          - pattern: hashlib.md5($PW, ...)
          - pattern: hashlib.sha1($PW, ...)
          - pattern: hashlib.new("md5", $PW, ...)
          - pattern: hashlib.new("sha1", $PW, ...)
          - pattern: md5($PW, ...)
          - pattern: sha1($PW, ...)
          - patterns:
              - pattern: |
                  $H = hashlib.$ALG(...)
                  ...
                  $H.update($PW, ...)
              - metavariable-regex:
                  metavariable: $ALG
                  regex: '^(md5|sha1)$'
      - metavariable-regex:
          metavariable: $PW
          regex: '(?i).*(passw|passwd|pwd|passphrase).*'
