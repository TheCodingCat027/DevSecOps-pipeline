# stages/secrets/gitleaks.toml — Gitleaks configuration for the `secrets` stage
# Pinned tool: gitleaks 8.30.1.  Every custom rule and allowlist entry is justified in README.md.
#
# This file is passed explicitly with `-c`, so a .gitleaks.toml inside the scanned
# repository can never replace or weaken it.

title = "DevSecOps pipeline - secrets stage"

[extend]
# Keep the full upstream default ruleset (aws-access-token, generic-api-key, ...).
useDefault = true

# ---------------------------------------------------------------------------
# Custom rule 1 - AWS secret access key assignment
# Gap: gitleaks 8.30.1 ships no rule for the AWS *secret* access key (only the
# access key ID `AKIA...`).  The generic-api-key rule does not fire on the seeded
# value (verified against demo-app/vulnerable/config.py, see README).
# Anchored on the variable NAME so that random 40-char base64 strings elsewhere
# are not flagged.  The value is >= 40 chars because real secrets are 40 chars;
# the Phase 1 fixture value is 42 chars, so an exact {40} match would miss it.
# ---------------------------------------------------------------------------
[[rules]]
id          = "aws-secret-access-key"
description = "Hard-coded AWS secret access key assignment"
regex       = '''(?i)\baws[_.-]?secret[_.-]?(?:access[_.-]?)?(?:key)?\b["']?\s*[:=]\s*["']?([A-Za-z0-9/+=]{40,})["']?'''
secretGroup = 1
entropy     = 3.5
keywords    = ["aws_secret", "aws-secret", "aws.secret", "awssecret"]

# ---------------------------------------------------------------------------
# Custom rule 2 - hard-coded Flask / Django style SECRET_KEY
# Gap: the seeded `SECRET_KEY = "dev-secret-key-not-for-production"` (config.py,
# app.py) has low entropy and is not caught by any default rule.  A hard-coded
# session-signing key lets an attacker forge sessions, so it is a real secret.
# Only quoted string literals of >= 8 characters are matched; reading the key
# from the environment (os.environ...) is not flagged.
# ---------------------------------------------------------------------------
[[rules]]
id          = "flask-hardcoded-secret-key"
description = "Hard-coded application SECRET_KEY (session signing key) in source"
regex       = '''(?i)\bSECRET_KEY\b["']?\s*\]?\s*[:=]\s*["']([^"'\s]{8,})["']'''
secretGroup = 1
keywords    = ["secret_key"]

# Rule-scoped allowlist: test code legitimately sets a throw-away SECRET_KEY
# (demo-app/fixed/tests/test_app.py produced 3 false positives before this entry).
# Scoped to THIS rule only - every other rule still scans test directories.
[[rules.allowlists]]
description = "Throw-away SECRET_KEY values in test code"
paths = [
    '''(^|/)tests?/''',
    '''(^|/)test_[^/]*\.py$''',
    '''(^|/)[^/]*_test\.py$''',
    '''(^|/)conftest\.py$''',
]

# ---------------------------------------------------------------------------
# Allowlist - ONLY genuinely safe locations (justified one by one in README.md).
# This list must never match anything under demo-app/vulnerable that carries a
# seeded secret (V1a/V1b); stages/secrets/tests/run_test.sh asserts this.
# ---------------------------------------------------------------------------
[[allowlists]]
description = "Placeholder env templates, test fixture directories and non-source / generated directories"
paths = [
    # 1. Documented placeholder templates: committed on purpose, contain no real values.
    '''(^|/)\.env\.(example|sample|template)$''',
    # 2. Test fixture directories (conventional place for deliberately fake data).
    '''(^|/)fixtures?/''',
    # 3. Non-source / generated content (vendored, VCS internals, bytecode, build output).
    '''(^|/)\.git/''',
    '''(^|/)node_modules/''',
    '''(^|/)(\.venv|venv)/''',
    '''(^|/)__pycache__/''',
    '''\.py[co]$''',
]
