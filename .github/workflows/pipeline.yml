# DevSecOps Pipeline — CI/CD Security Integration Workflow
# Owner: P1 — only P1 may modify this file (see CODEOWNERS).
# Architecture: docs/p1-architecture.md
#
# Job flow:
#   contracts-and-tests
#       ↓
#   prepare  →  build-image
#       ↓               ↓
#   stage (matrix, parallel, fail-fast:false)
#       ↓
#   gate
#       ↓
#   deploy (mock, main branch only)

name: DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: "Target path to scan (default: demo-app/vulnerable)"
        required: false
        default: "demo-app/vulnerable"
  # Reusable workflow — other repos can call this pipeline
  workflow_call:
    inputs:
      target:
        description: "Target path to scan"
        type: string
        required: false
        default: "demo-app/vulnerable"
    secrets:
      # Add any required secrets here when the pipeline becomes non-stub
      DEPLOY_TOKEN:
        required: false

# Cancel superseded runs on the same ref to save CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimal permissions at workflow level; jobs grant more only when needed
permissions:
  contents: read

# Default target — overridden by workflow_dispatch input or workflow_call input
env:
  DEFAULT_TARGET: "demo-app/vulnerable"

jobs:

  # ──────────────────────────────────────────────────────────────────────────
  # Job 1: contracts-and-tests (required check)
  # Architecture: validates all contracts and runs all pytest tests
  # ──────────────────────────────────────────────────────────────────────────
  contracts-and-tests:
    name: contracts-and-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4  # v4.1.7

      - name: Set up Python
        uses: actions/setup-python@v5  # v5.1.1
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: contracts/requirements.txt

      - name: Install contract dependencies
        run: pip install -r contracts/requirements.txt

      - name: Install demo-app dependencies (for app tests)
        run: |
          pip install Flask==3.1.0  # fixed app version for tests
          pip install pytest

      - name: "Validate all SARIF samples"
        run: python contracts/validate.py contracts/samples/

      - name: "Validate baseline policy"
        run: python contracts/validate.py security-policy.yaml --policy security-policy.yaml

      - name: "Run pytest (contracts + demo-app)"
        run: pytest contracts/tests/ demo-app/tests/ gate/tests/ -v --tb=short

      - name: "Run vulnerable demo-app tests"
        working-directory: demo-app/vulnerable
        run: pytest tests -q

      - name: "Run fixed demo-app tests"
        working-directory: demo-app/fixed
        run: pytest tests -q

  # ──────────────────────────────────────────────────────────────────────────
  # Job 2: prepare — read stages.json and build CI matrix
  # Architecture: decouples stage list from pipeline definition
  # ──────────────────────────────────────────────────────────────────────────
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      target: ${{ steps.resolve-target.outputs.target }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve target path
        id: resolve-target
        env:
          DISPATCH_TARGET: ${{ github.event.inputs.target }}
          CALL_TARGET: ${{ inputs.target }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TARGET="$DISPATCH_TARGET"
          elif [[ "${{ github.event_name }}" == "workflow_call" ]]; then
            TARGET="$CALL_TARGET"
          else
            TARGET="${{ env.DEFAULT_TARGET }}"
          fi
          if [[ "$TARGET" == /* || "$TARGET" == *..* || ! "$TARGET" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "[prepare] ERROR: invalid target path: $TARGET" >&2
            exit 2
          fi
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "[prepare] Scan target: $TARGET"

      - name: Build stage matrix from stages.json
        id: build-matrix
        run: |
          # Read enabled stages and build a JSON array for the matrix
          MATRIX=$(python3 -c "
          import json, sys
          with open('stages/stages.json') as f:
              data = json.load(f)
          enabled = [s for s in data['stages'] if s.get('enabled', True)]
          # Output: {include: [{name, needs_image}, ...]}
          matrix = {'include': [{'name': s['name'], 'needs_image': str(s.get('needs_image', False)).lower()} for s in enabled]}
          print(json.dumps(matrix))
          ")
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "[prepare] Matrix: $MATRIX"

  # ──────────────────────────────────────────────────────────────────────────
  # Job 3: build-image — build and export Docker image
  # Architecture: centralised build so all needs_image stages use the same image
  # ──────────────────────────────────────────────────────────────────────────
  build-image:
    name: build-image
    runs-on: ubuntu-latest
    needs: prepare
    outputs:
      image_ref: ${{ steps.build.outputs.image_ref }}
      has_dockerfile: ${{ steps.check.outputs.has_dockerfile }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for Dockerfile
        id: check
        env:
          TARGET: ${{ needs.prepare.outputs.target }}
        run: |
          if [[ -f "$TARGET/Dockerfile" ]]; then
            echo "has_dockerfile=true" >> "$GITHUB_OUTPUT"
            echo "[build-image] Dockerfile found at $TARGET/Dockerfile"
          else
            echo "has_dockerfile=false" >> "$GITHUB_OUTPUT"
            echo "[build-image] No Dockerfile found at $TARGET — skipping build"
          fi

      - name: Build Docker image
        id: build
        if: steps.check.outputs.has_dockerfile == 'true'
        env:
          TARGET: ${{ needs.prepare.outputs.target }}
          IMAGE_TAG: devsecops-pipeline-target:${{ github.sha }}
        run: |
          echo "[build-image] Building image: $IMAGE_TAG from $TARGET"
          docker build -t "$IMAGE_TAG" "$TARGET" || {
            echo "[build-image] Docker build failed — this is expected for the vulnerable app in some environments"
            echo "image_ref=" >> "$GITHUB_OUTPUT"
            exit 0
          }
          echo "image_ref=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          # Export image to tar for artifact upload
          mkdir -p image-export
          docker save "$IMAGE_TAG" > image-export/image.tar
          echo "[build-image] Image exported to image-export/image.tar"

      - name: Upload image artifact
        if: steps.check.outputs.has_dockerfile == 'true' && steps.build.outputs.image_ref != ''
        uses: actions/upload-artifact@v4  # v4.3.3
        with:
          name: docker-image
          path: image-export/image.tar
          retention-days: 1

  # ──────────────────────────────────────────────────────────────────────────
  # Job 4: stage — parallel security scanning (matrix)
  # Architecture: each enabled stage runs independently; fail-fast:false so
  #               all stages complete even if one fails, giving full coverage.
  # ──────────────────────────────────────────────────────────────────────────
  stage:
    name: stage (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: [prepare, build-image]
    strategy:
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false   # All stages must complete for the gate to have full data
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: contracts/requirements.txt

      - name: Install contract dependencies
        run: pip install -r contracts/requirements.txt

      - name: Record stage start time
        run: echo "STAGE_START=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      # Download and load Docker image for needs_image stages
      - name: Download image artifact
        if: matrix.needs_image == 'true' && needs.build-image.outputs.has_dockerfile == 'true' && needs.build-image.outputs.image_ref != ''
        uses: actions/download-artifact@v4  # v4.1.7
        with:
          name: docker-image
          path: image-export/

      - name: Load Docker image
        if: matrix.needs_image == 'true' && needs.build-image.outputs.has_dockerfile == 'true' && needs.build-image.outputs.image_ref != ''
        run: |
          docker load < image-export/image.tar
          echo "IMAGE_REF=${{ needs.build-image.outputs.image_ref }}" >> "$GITHUB_ENV"
          echo "[stage] IMAGE_REF set to ${{ needs.build-image.outputs.image_ref }}"

      # Run the stage via the composite action
      - name: Run stage and validate output
        uses: ./.github/actions/run-stage
        with:
          stage: ${{ matrix.name }}
          target: ${{ needs.prepare.outputs.target }}
          needs_image: ${{ matrix.needs_image }}

      - name: Record stage end time and write summary
        if: always()
        run: |
          STAGE_END=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "| Stage | Start | End |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| ${{ matrix.name }} | $STAGE_START | $STAGE_END |" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload stage report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.name }}
          path: reports/
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────
  # Job 5: gate — apply security policy and decide deployment
  # Architecture: downloads all stage reports, runs the policy gate,
  #               fails the job (and blocks deploy) if policy is violated.
  # ──────────────────────────────────────────────────────────────────────────
  gate:
    name: gate
    runs-on: ubuntu-latest
    needs: stage
    if: always()   # Run even if some stages failed (gate handles partial data)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: contracts/requirements.txt

      - name: Install dependencies
        run: pip install -r contracts/requirements.txt

      - name: Record gate start time
        run: echo "GATE_START=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Download all stage reports
        uses: actions/download-artifact@v4
        with:
          pattern: reports-*
          merge-multiple: true
          path: reports/

      - name: Run security policy gate
        run: |
          mkdir -p gate-out
          python gate/run_gate.py \
            --reports reports \
            --policy  security-policy.yaml \
            --out     gate-out

      - name: Record gate end time and write summary
        if: always()
        run: |
          GATE_END=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Security Gate Result" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f gate-out/gate-result.json ]]; then
            python3 -c "
          import json, sys
          with open('gate-out/gate-result.json') as f:
              r = json.load(f)
          d = r.get('decision', 'unknown').upper()
          c = r.get('counts', {})
          print(f'**Decision:** {d}')
          print(f'**Mode:** {r.get(\"mode\", \"unknown\")}')
          print()
          print('| Severity | Count |')
          print('|---|---|')
          for sev in ['Critical', 'High', 'Medium', 'Low']:
              print(f'| {sev} | {c.get(sev, 0)} |')
          print(f'| **Total** | **{c.get(\"total\", 0)}** |')
          v = r.get('violations', [])
          if v:
              print()
              print('**Violations:**')
              for vi in v:
                  print(f'- {vi}')
          " >> "$GITHUB_STEP_SUMMARY"
          else
            echo "gate-result.json not found" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Phase | Start | End |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| gate | $GATE_START | $GATE_END |" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload gate output artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-out
          path: gate-out/
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────
  # Job 6: deploy (mock)
  # Architecture: ONLY runs when gate passes AND the push is to main.
  # IMPORTANT: This deploy job is a MOCK. It must never be connected to a
  # real deployment environment. The vulnerable target must never be deployed.
  # P4 or the team may extend this to a real staging deployment in Phase 5.
  # ──────────────────────────────────────────────────────────────────────────
  deploy:
    name: deploy (mock)
    runs-on: ubuntu-latest
    needs: [gate, build-image]
    # Only deploy on push to main, and only when the gate job succeeded (exit 0)
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.gate.result == 'success'
    environment: staging
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mock deployment
        env:
          IMAGE_REF: ${{ needs.build-image.outputs.image_ref || 'no-image-built' }}
        run: |
          echo "============================================"
          echo "[deploy] MOCK DEPLOYMENT"
          echo "[deploy] Image: $IMAGE_REF"
          echo "[deploy] Environment: staging"
          echo "[deploy] Gate: PASSED"
          echo "[deploy] Commit: ${{ github.sha }}"
          echo "============================================"
          echo "This is a stub. P5 will connect this to a real staging environment."
          echo ""
          echo "NOTE: The vulnerable target (demo-app/vulnerable) must NEVER be"
          echo "      deployed to a real environment. Replace the target with a"
          echo "      production-safe image before enabling real deployment."
